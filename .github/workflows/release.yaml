name: release
# Weekly: every held package whose cause builds again in nixos-unstable, on
# x86_64 and aarch64, gets a PR removing its hold (auto-merge); one held for
# more than 14 days alerts via ntfy, since it misses the fixes of the newer
# nixpkgs.
on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * 1'

# Every step that needs GitHub gets the App token explicitly.
permissions: {}

jobs:
  # The Pis and orin-nano use the holds too: check-only here, and its `held`
  # keeps those holds in the release job below.
  check-aarch64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    outputs:
      held: ${{ steps.check.outputs.held }}
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: kleinbem/actions/nix-setup@f716d62182471a9e862ae0bd61d34201e6cea971 # v1.3.1
        with:
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}

      - uses: kleinbem-dev/nix-detour/hold-release@e0504b7ed4a7fe909fcc5a042b5e52632e209a19 # main after v0.3.1 (open-prs, keep)
        id: check
        with:
          open-prs: "false"

  release:
    needs: check-aarch64
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # hold-release opens its PRs on this repo through the API.
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Holds are released from main's list, also on a dispatch from a branch.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false # hold-release commits through the API, not git push

      # Attic + NetBird: the release checks of our own packages.
      - uses: kleinbem/actions/nix-setup@f716d62182471a9e862ae0bd61d34201e6cea971 # v1.3.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}

      - uses: kleinbem-dev/nix-detour/hold-release@e0504b7ed4a7fe909fcc5a042b5e52632e209a19 # main after v0.3.1 (open-prs, keep)
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          keep: ${{ needs.check-aarch64.outputs.held }}

      - name: Alert for holds older than 14 days
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_ALERT_TOPIC }}
          stale_x86: ${{ steps.release.outputs.stale }}
          stale_arm: ${{ needs.check-aarch64.outputs.stale }}
        run: |
          set -euo pipefail
          # "name (N days)" entries from both systems, each once.
          long=$(printf '%s %s' "$stale_x86" "$stale_arm" | grep -oE '[^ ]+ \([0-9]+ days\)' | sort -u | tr '\n' ' ' || true)
          if [ -z "$long" ] || [ -z "$NTFY_TOPIC" ]; then
            exit 0
          fi
          curl -fsS --max-time 15 \
            -H "Title: packages held back from nixpkgs for more than 14 days" \
            -H "Tags: warning" \
            -d "Still held: $long- they miss the fixes of the fleet's nixpkgs. Their links are in kleinbem/nix-detour-fleet held-packages.json. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.kleinbem.dev/$NTFY_TOPIC"
