name: check

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kleinbem/actions/nix-setup@f716d62182471a9e862ae0bd61d34201e6cea971 # v1.3.1
      - name: Evaluate the held packages
        run: nix flake check
      # The aarch64 hosts (Pis, orin-nano) use the holds too; evaluate them here.
      - name: Evaluate the held packages for every system
        run: nix flake check --all-systems --no-build
      - name: Formatting
        run: nix fmt -- --fail-on-change
